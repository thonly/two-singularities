name: RFC 3161 trusted timestamps

# The second timestamp leg, beside the OpenTimestamps job in this same repo.
#
# WHY A SECOND LEG AT ALL, AND WHY NOT A SECOND BLOCKCHAIN. Bitcoin and any other
# chain fail together on the question that decides the matter: whether the forum
# accepts a blockchain as evidence. Two chains is the same exhibit twice. An
# RFC 3161 timestamp fails for unrelated reasons — it is signed by a named legal
# authority, is recognised by courts today, and under eIDAS Art. 41 a *qualified*
# timestamp carries a presumption of the accuracy of its date. What it does NOT
# have is permanence: its trust anchor expires, and the authority may close.
# Bitcoin has permanence and no legal standing; a TSA has legal standing and no
# permanence. Each leg covers precisely the other's weakness.
#
# WHAT IS SIGNED. Not each file — a dated MANIFEST of every git-tracked path and
# its SHA-256. That fixes a live gap in the .ots leg: `ots stamp` never re-stamps,
# so a REVISED document keeps attesting its superseded text until a human rotates
# the proof by hand. This job re-attests the current text of everything weekly,
# with no human step. Each manifest also covers all earlier manifests and tokens,
# so the series is a hash chain and no past manifest can be quietly altered.
#
# SCHEDULING. Runs two hours after the OpenTimestamps job (17 4 * * 0), because
# both commit to this repo and a simultaneous push would collide. No push
# trigger, for the same commit-loop reason the OTS job gives.
#
# NO SECRETS. Every authority used is free and unauthenticated, and the only
# credential is the repo-scoped GITHUB_TOKEN. Nothing to fund, nothing to rotate.
# That was a selection criterion, not a coincidence.

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rfc3161:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only so tsa-stamp.sh can also lay a Bitcoin stamp on the manifest,
      # putting both trust models on one artifact. Not required for the TSA leg.
      - name: Install OpenTimestamps client
        run: pip install --quiet opentimestamps-client

      - name: Stamp the manifest
        run: |
          ./tsa-stamp.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify what was just written
        run: |
          {
            echo ""
            echo "### Verification"
            echo '```'
            ./tsa-verify.sh || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit any changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "timestamps: RFC 3161 manifest for $(date -u +%Y-%m-%d)"
          # The OTS job commits to this same branch; rebase rather than fail if it
          # landed something between checkout and here.
          git pull --rebase --autostash
          git push
